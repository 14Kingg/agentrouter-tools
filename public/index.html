<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentRouter Tools</title>
<style>
:root{font-family:Inter,"Segoe UI",sans-serif;color:#e8eaf0;background:#101218;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}.app{max-width:1180px;margin:0 auto;padding:36px 24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
h1{font-size:24px;margin:0}small,.muted{color:#9299a8}.pill{border:1px solid #303644;border-radius:99px;padding:6px 10px;font-size:12px}
button,input{font:inherit;border-radius:9px;border:1px solid #303644;padding:10px 14px;background:#1b202a;color:#eef0f5}
button{cursor:pointer}button.primary{background:#477ef5;border-color:#477ef5;color:white}button.danger{color:#ff7777}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.card{background:#171b24;border:1px solid #292f3c;border-radius:14px;padding:18px}
.metric{font-size:28px;font-weight:700;margin-top:10px}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #292f3c;gap:10px}
.row:last-child{border:0}.logs{height:250px;overflow:auto;font:12px/1.7 ui-monospace,monospace;color:#b9c1d0;white-space:pre-wrap}
input{min-width:100px}.field{display:flex;gap:8px;align-items:center}
@media(max-width:700px){.grid{grid-template-columns:1fr}.app{padding:20px 14px}header{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
</head>
<body><main class="app">
<header><div><h1>AgentRouter Tools</h1><small>本地自动签到管理面板 · Node.js</small></div><span class="pill" id="status">正在连接</span></header>
<div class="grid">
 <div class="card"><small>已配置账号</small><div class="metric" id="accountCount">0</div></div>
 <div class="card"><small>最近一次签到</small><div class="metric" id="lastRun">--</div></div>
 <div class="card"><small>定时任务</small><div class="metric" id="scheduleView">01:00</div></div>
</div>
<section class="card section"><div class="toolbar"><h2 style="margin-right:auto">账号管理</h2><input id="accountName" placeholder="账号备注，例如 main"><button class="primary" onclick="addAccount()">添加 GitHub 账号</button><button onclick="runNow()">立即签到</button></div><div id="accounts" class="section muted">暂无账号</div></section>
<section class="card section"><h2>自动任务</h2><div class="toolbar"><label class="field">每天时间 <input type="time" id="runTime" value="01:00"></label><label class="field">HTTP 代理 <input id="proxyUrl" placeholder="http://127.0.0.1:7890" style="width:230px"></label><label class="field"><input type="checkbox" id="enabled" checked>启用自动签到</label><button class="primary" onclick="saveSettings()">保存设置</button></div><small>按运行这台电脑的本地时区执行；电脑休眠或关机时不会运行。</small></section>
<section class="card section"><h2>执行记录</h2><div id="runs" class="muted">暂无记录</div></section>
<section class="card section"><h2>实时日志</h2><div id="logs" class="logs"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.statusText);return d}
async function refresh(){const s=await api('/api/state');$('accountCount').textContent=s.accounts.length;$('status').textContent=s.running?'任务执行中':'服务运行中';$('scheduleView').textContent=s.enabled?s.schedule:'已暂停';$('enabled').checked=s.enabled;$('proxyUrl').value=s.proxyUrl||'';const m=s.schedule.match(/^(\d+) (\d+) \* \* \*$/);if(m)$('runTime').value=m[2].padStart(2,'0')+':'+m[1].padStart(2,'0');
$('accounts').innerHTML=s.accounts.length?s.accounts.map(a=>'<div class="row"><div><b>'+esc(a.name)+'</b><br><small>'+esc(a.status)+'</small></div><button class="danger" onclick="removeAccount('+a.id+')">删除</button></div>').join(''):'尚未添加账号';
$('runs').innerHTML=s.runs.length?s.runs.slice(0,12).map(r=>'<div class="row"><div><b>'+esc(r.account_name)+'</b><br><small>'+esc(r.message||'')+'</small></div><span class="pill">'+esc(r.status)+' · '+esc(r.created_at)+'</span></div>').join(''):'暂无记录';
$('lastRun').textContent=s.runs[0]?s.runs[0].status:'--'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function addAccount(){const name=$('accountName').value.trim();if(!name)return alert('请填写账号备注');try{await api('/api/accounts',{method:'POST',body:JSON.stringify({name})});$('accountName').value='';await refresh()}catch(e){alert(e.message)}}
async function removeAccount(id){if(!confirm('确定删除该账号及本地浏览器会话？'))return;await api('/api/accounts/'+id,{method:'DELETE'});refresh()}
async function runNow(){try{await api('/api/run',{method:'POST'});alert('签到任务已启动')}catch(e){alert(e.message)}}
async function saveSettings(){const [h,m]=$('runTime').value.split(':');await api('/api/settings',{method:'PUT',body:JSON.stringify({schedule:m+' '+Number(h)+' * * *',enabled:$('enabled').checked,proxyUrl:$('proxyUrl').value.trim()})});refresh();alert('设置已保存')}
const es=new EventSource('/api/events');es.onmessage=e=>{const l=JSON.parse(e.data);$('logs').textContent='['+l.time+'] ['+l.level.toUpperCase()+'] '+l.message+'\n'+$('logs').textContent;refresh()};
refresh().catch(e=>{$('status').textContent=e.message});
</script></body></html>
